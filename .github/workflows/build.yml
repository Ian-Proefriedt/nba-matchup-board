name: Build board

on:
  schedule:
    # Every 30 min from noon to midnight ET (cron is UTC), so lineup and injury news shows up through tip-off.
    # StatMuse game logs are cached per day, so most runs only re-pull Rotowire and FanDuel.
    - cron: "*/30 16-23 * * *"
    - cron: "*/30 0-4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: cache
          key: statmuse-${{ github.run_id }}
          restore-keys: statmuse-  # also holds the Odds API pull, so it isn't re-bought every run
      - run: python -u build.py
        env:
          # Optional: The Odds API key for exact FanDuel/DraftKings bet slip links (Settings → Secrets → Actions)
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_REFRESH_MIN: ${{ vars.ODDS_API_REFRESH_MIN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
