<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matchup Board</title>
<meta name="description" content="Tonight's NBA lineups, injuries and odds with each player's last 10 games from StatMuse.">
<meta name="theme-color" content="#d24a12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Matchups">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: sticky game picker, then one card per game: scorebug, odds, position-by-position matchups (away | POS | home), injuries */
:root {
  --bg: #edf1f5;
  --surface: #ffffff;
  --surface-2: #f4f6f9;
  --ink: #111a27;
  --muted: #5a6a7e;
  --line: #d8dfe8;
  --accent: #d24a12;
  --accent-ink: #ffffff;
  --accent-soft: #f6d6c6;
  --q: #8a5a00;
  --q-bg: #fbedc9;
  --out: #b42318;
  --out-bg: #fbdcd8;
  --link: #0f4fa8;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0c121b; --surface: #141c28; --surface-2: #1b2534; --ink: #e6ecf4; --muted: #95a4b8;
    --line: #273345; --accent: #f37a43; --accent-ink: #1a0b03; --accent-soft: #5a2c17; --q: #f1c15a; --q-bg: #3d2f0d;
    --out: #ff8a7d; --out-bg: #45160f; --link: #7cb6ff;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-bottom: max(32px, env(safe-area-inset-bottom, 0px));
}
.wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 14px; }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
button { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }

header.top { padding-top: max(16px, env(safe-area-inset-top, 0px)); display: grid; gap: 2px; }
header.top h1 { font-family: var(--display); font-weight: 700; font-size: 1.9rem; line-height: 1.1; margin: 0; }
header.top p { margin: 0; color: var(--muted); font-size: .9rem; }

.bar {
  position: sticky; top: 0; z-index: 5; background: var(--bg);
  padding-top: max(8px, env(safe-area-inset-top, 0px)); padding-bottom: 8px; display: grid; gap: 8px;
}
.picker { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.picker::-webkit-scrollbar { display: none; }
.picker a {
  flex: none; display: grid; text-align: center; padding: 6px 10px; border-radius: 8px; background: var(--surface);
  border: 1px solid var(--line); color: var(--ink); text-decoration: none; line-height: 1.2;
}
.picker a b { font-family: var(--display); font-size: 1rem; }
.picker a span { font-size: .72rem; color: var(--muted); }
.controls { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: .82rem; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 5px 12px; cursor: pointer; font-weight: 600; font-size: .82rem; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.game { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; scroll-margin-top: 120px; }
.scorebug { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 14px 14px 10px; }
.team { min-width: 0; }
.team.home { text-align: right; }
.team .abbr { font-family: var(--display); font-weight: 700; font-size: 2.1rem; line-height: 1; }
.team .meta { font-size: .82rem; color: var(--muted); }
.lineup-status { font-size: .72rem; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; }
.lineup-status.confirmed { color: #2f8a57; }
.lineup-status.expected { color: var(--q); }
.at { text-align: center; font-family: var(--display); font-weight: 600; color: var(--muted); }
.at .time { display: block; color: var(--ink); font-size: 1.1rem; }

.odds { display: flex; flex-wrap: wrap; gap: 4px 18px; padding: 8px 14px; background: var(--surface-2); border-block: 1px solid var(--line); font-size: .85rem; }
.odds span { color: var(--muted); }
.odds b { font-weight: 600; margin-left: 4px; }

.block { padding: 12px 14px 14px; border-bottom: 1px solid var(--line); }
.block:last-child { border-bottom: 0; }
.block h2 {
  font-family: var(--display); font-weight: 600; font-size: .9rem; text-transform: uppercase; letter-spacing: .08em;
  color: var(--muted); margin: 0 0 8px;
}

.mu { display: grid; gap: 4px; }
.mu-row { display: grid; grid-template-columns: minmax(0,1fr) 34px minmax(0,1fr); gap: 6px; align-items: stretch; }
.pos { display: grid; place-items: center; font-family: var(--display); font-weight: 700; background: var(--surface-2); border-radius: 6px; }
.player { min-width: 0; padding: 6px 4px; display: grid; gap: 4px; align-content: start; }
.player.home { text-align: right; }
.nameline { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; min-width: 0; }
.player.home .nameline { justify-content: flex-end; }
.pname { font-weight: 600; overflow-wrap: anywhere; }
.chip { font-size: .66rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 1px 5px; border-radius: 4px; white-space: nowrap; }
.chip.q { color: var(--q); background: var(--q-bg); }
.chip.out { color: var(--out); background: var(--out-bg); }

.minline { display: flex; align-items: center; gap: 6px; }
.player.home .minline { flex-direction: row-reverse; }
.minval {
  font-family: var(--display); font-weight: 700; font-size: 1rem; min-width: 38px; text-align: center; line-height: 1.5;
  background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 0 6px;
}
.minval small { font-size: .62rem; font-weight: 600; margin-left: 1px; }
.spark { display: flex; align-items: flex-end; gap: 2px; height: 22px; flex: 1; min-width: 0; max-width: 90px; }
.player.home .spark { justify-content: flex-end; }
.spark i { flex: 1; max-width: 7px; background: var(--accent-soft); border-radius: 1px; min-height: 2px; }
.spark i.last { background: var(--accent); }
.statline { font-size: .78rem; color: var(--muted); }
.statline b { color: var(--ink); font-weight: 600; }
.more { justify-self: start; border: 0; background: none; padding: 0; color: var(--link); font-size: .78rem; cursor: pointer; }
.player.home .more { justify-self: end; }
.nodata { font-size: .78rem; color: var(--muted); }

.detail { grid-column: 1 / -1; background: var(--surface-2); border-radius: 8px; padding: 8px 10px; }
.detail h3 { margin: 0 0 6px; font-size: .85rem; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.detail h3 a { font-weight: 600; font-size: .8rem; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .8rem; font-variant-numeric: tabular-nums; }
th, td { padding: 4px 6px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 600; font-size: .7rem; letter-spacing: .04em; }
th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
tr.avg td { font-weight: 700; border-bottom: 0; }

.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 20px; }
.col h3 { font-family: var(--display); font-weight: 700; font-size: 1rem; margin: 0 0 4px; }
.li { display: flex; align-items: center; gap: 6px; padding: 4px 0; flex-wrap: wrap; font-size: .9rem; }
.li .p { font-family: var(--display); font-weight: 600; color: var(--muted); width: 18px; }
.li .m { margin-left: auto; font-size: .78rem; color: var(--muted); }
.empty { font-size: .85rem; color: var(--muted); }

footer { color: var(--muted); font-size: .8rem; display: grid; gap: 4px; }
.state { padding: 40px 0; text-align: center; color: var(--muted); }

@media (max-width: 560px) {
  .cols { grid-template-columns: 1fr; }
  .team .abbr { font-size: 1.8rem; }
  .pname { font-size: .92rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Tonight's Matchup Board</h1>
    <p id="sub">Loading tonight's slate…</p>
  </header>
  <div class="bar" id="bar" hidden>
    <nav class="picker" id="picker" aria-label="Games"></nav>
    <div class="controls">
      <span>Tap a name for StatMuse. Minutes are actual, not projected.</span>
      <div class="seg" role="group" aria-label="Averages over">
        <button type="button" id="r10" aria-pressed="true">Last 10</button>
        <button type="button" id="r5" aria-pressed="false">Last 5</button>
      </div>
    </div>
  </div>
  <main id="games"><div class="state">Loading…</div></main>
  <footer>
    <span>Lineups, injuries, odds and refs from Rotowire. Game logs from StatMuse. Updated once a day; lineups can change after that.</span>
    <span id="missing"></span>
  </footer>
</div>

<script>
const state = { range: "10", data: null };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const slug = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[.']/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const last10Url = n => `https://www.statmuse.com/nba/ask/${slug(n)}-last-10-games`;
const vsUrl = (n, team) => `https://www.statmuse.com/nba/ask/${slug(n)}-stats-vs-${slug(team)}`;
const fmt = v => v == null ? "–" : (Number.isInteger(v) ? String(v) : v.toFixed(1));
const avgs = p => p.last10 && (state.range === "5" ? p.last10.avgLast5 : p.last10.avg);

function chip(status) {
  if (!status) return "";
  const cls = status === "Out" || status === "OFS" ? "out" : "q";
  return `<span class="chip ${cls}">${esc(status)}</span>`;
}

function spark(p) {
  const games = p.last10.games.slice(state.range === "5" ? -5 : -10);
  const bars = games.map((g, i) => `<i class="${i === games.length - 1 ? "last" : ""}" style="height:${Math.max(6, Math.min(100, (g.min || 0) / 48 * 100))}%" title="${esc(g.date)} ${esc(g.homeAway)} ${esc(g.opp)}: ${fmt(g.min)} min"></i>`).join("");
  return `<span class="spark" aria-hidden="true">${bars}</span>`;
}

function playerCell(p, side, opp, key) {
  if (!p) return `<div class="player ${side}"></div>`;
  const a = avgs(p);
  const body = a
    ? `<div class="minline"><span class="minval num" title="Average minutes, last ${state.range}">${fmt(a.min)}<small>m</small></span>${spark(p)}</div>
       <div class="statline num"><b>${fmt(a.pts)}</b> pts · <b>${fmt(a.reb)}</b> reb · <b>${fmt(a.ast)}</b> ast</div>
       <button class="more" type="button" data-key="${key}">Game log</button>`
    : `<span class="nodata">No StatMuse log</span>`;
  return `<div class="player ${side}">
    <div class="nameline"><a class="pname" href="${last10Url(p.name)}" target="_blank" rel="noopener">${esc(p.name)}</a>${chip(p.status)}</div>
    ${body}
  </div>`;
}

function detailPanel(p, opp) {
  const rows = p.last10.games.map(g => `<tr><td>${esc(g.date.replace(/\/\d{4}$/, ""))}</td><td>${esc(g.homeAway === "@" ? "@" : "vs")} ${esc(g.opp)}</td><td>${fmt(g.min)}</td><td>${fmt(g.pts)}</td><td>${fmt(g.reb)}</td><td>${fmt(g.ast)}</td><td>${fmt(g.threes)}</td><td>${g.plusMinus == null ? "–" : (g.plusMinus > 0 ? "+" : "") + g.plusMinus}</td></tr>`).reverse().join("");
  const a = p.last10.avg;
  return `<div class="detail">
    <h3><span>${esc(p.name)} · last ${p.last10.games.length} games</span><span><a href="${last10Url(p.name)}" target="_blank" rel="noopener">StatMuse</a> · <a href="${vsUrl(p.name, opp.name)}" target="_blank" rel="noopener">vs ${esc(opp.abbr)}</a></span></h3>
    <div class="tablewrap"><table>
      <thead><tr><th>DATE</th><th>OPP</th><th>MIN</th><th>PTS</th><th>REB</th><th>AST</th><th>3PM</th><th>+/-</th></tr></thead>
      <tbody>${rows}<tr class="avg"><td>Avg</td><td></td><td>${fmt(a.min)}</td><td>${fmt(a.pts)}</td><td>${fmt(a.reb)}</td><td>${fmt(a.ast)}</td><td>${fmt(a.threes)}</td><td></td></tr></tbody>
    </table></div>
  </div>`;
}

function injuryList(team) {
  if (!team.mayNotPlay.length) return `<div class="empty">Nobody listed.</div>`;
  return team.mayNotPlay.map(p => {
    const a = avgs(p);
    return `<div class="li"><span class="p">${esc(p.pos)}</span><a href="${last10Url(p.name)}" target="_blank" rel="noopener">${esc(p.name)}</a>${chip(p.status)}${a ? `<span class="m num">${fmt(a.min)} min L${state.range}</span>` : ""}</div>`;
  }).join("");
}

function lineupTag(team) {
  const s = (team.lineupStatus || "").toLowerCase();
  const cls = s.includes("confirmed") ? "confirmed" : "expected";
  return team.lineupStatus ? `<span class="lineup-status ${cls}">${esc(team.lineupStatus)}</span>` : "";
}

function gameId(g) { return `${g.away.abbr}-${g.home.abbr}`.toLowerCase(); }

function renderGame(g, gi) {
  const n = Math.max(g.away.starters.length, g.home.starters.length);
  let rows = "";
  for (let i = 0; i < n; i++) {
    const a = g.away.starters[i], h = g.home.starters[i];
    rows += `<div class="mu-row" data-row="${gi}-${i}">${playerCell(a, "away", g.home, `${gi}-${i}-away`)}<div class="pos">${esc((a || h).pos)}</div>${playerCell(h, "home", g.away, `${gi}-${i}-home`)}</div>`;
  }
  const o = g.odds || {};
  return `<article class="game" id="${gameId(g)}">
    <div class="scorebug">
      <div class="team away"><div class="abbr">${esc(g.away.abbr)}</div><div class="meta">${esc(g.away.name)} <span class="num">(${esc(g.away.record)})</span></div>${lineupTag(g.away)}</div>
      <div class="at"><span class="time">${esc(g.time.replace(" ET", ""))}</span>@</div>
      <div class="team home"><div class="abbr">${esc(g.home.abbr)}</div><div class="meta">${esc(g.home.name)} <span class="num">(${esc(g.home.record)})</span></div>${lineupTag(g.home)}</div>
    </div>
    <div class="odds num">
      <div><span>Line</span><b>${esc(o.moneyline || "–")}</b></div>
      <div><span>Spread</span><b>${esc(o.spread || "–")}</b></div>
      <div><span>O/U</span><b>${esc((o.total || "–").replace(" Pts", ""))}</b></div>
      ${g.refs.length ? `<div><span>Refs</span><b>${esc(g.refs.join(", "))}</b></div>` : ""}
    </div>
    <section class="block"><h2>Starting matchups</h2><div class="mu">${rows}</div></section>
    <section class="block"><h2>May not play</h2>
      <div class="cols">
        <div class="col"><h3>${esc(g.away.name)}</h3>${injuryList(g.away)}</div>
        <div class="col"><h3>${esc(g.home.name)}</h3>${injuryList(g.home)}</div>
      </div>
    </section>
  </article>`;
}

function render() {
  const d = state.data;
  document.getElementById("games").innerHTML = d.games.length
    ? `<div style="display:grid;gap:14px">${d.games.map(renderGame).join("")}</div>`
    : `<div class="state">No games on Rotowire's board right now.</div>`;
}

function toggleDetail(btn) {
  const [gi, i, side] = btn.dataset.key.split("-");
  const g = state.data.games[gi];
  const p = g[side].starters[i];
  const row = btn.closest(".mu-row");
  const open = row.nextElementSibling && row.nextElementSibling.classList.contains("detail") && row.nextElementSibling.dataset.key === btn.dataset.key;
  if (row.nextElementSibling && row.nextElementSibling.classList.contains("detail")) row.nextElementSibling.remove();
  document.querySelectorAll(`.mu-row[data-row="${gi}-${i}"] .more`).forEach(b => b.textContent = "Game log");
  if (open) return;
  row.insertAdjacentHTML("afterend", detailPanel(p, side === "away" ? g.home : g.away));
  row.nextElementSibling.dataset.key = btn.dataset.key;
  btn.textContent = "Hide log";
}

function setRange(r) {
  state.range = r;
  document.getElementById("r10").setAttribute("aria-pressed", String(r === "10"));
  document.getElementById("r5").setAttribute("aria-pressed", String(r === "5"));
  try { localStorage.setItem("range", r); } catch (e) {}
  render();
}

async function load() {
  try { const r = localStorage.getItem("range"); if (r === "5" || r === "10") state.range = r; } catch (e) {}
  try {
    const res = await fetch(`data.json?t=${Date.now()}`, { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    state.data = await res.json();
  } catch (e) {
    document.getElementById("sub").textContent = "Couldn't load tonight's data. Pull down to refresh, or try again later.";
    document.getElementById("games").innerHTML = "";
    return;
  }
  const d = state.data;
  const updated = new Date(d.updatedAt).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" });
  document.getElementById("sub").textContent = `${d.slateDate || ""} · ${d.games.length} games · updated ${updated}`;
  document.getElementById("picker").innerHTML = d.games.map(g => `<a href="#${gameId(g)}"><b>${esc(g.away.abbr)} @ ${esc(g.home.abbr)}</b><span>${esc(g.time.replace(" ET", ""))}</span></a>`).join("");
  document.getElementById("bar").hidden = false;
  if (d.missingStats && d.missingStats.length) document.getElementById("missing").textContent = `No StatMuse log found for: ${d.missingStats.join(", ")}.`;
  setRange(state.range);
}

document.addEventListener("click", e => {
  const more = e.target.closest(".more");
  if (more) toggleDetail(more);
  if (e.target.id === "r10") setRange("10");
  if (e.target.id === "r5") setRange("5");
});
load();
</script>
</body>
</html>
